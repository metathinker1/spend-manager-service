[project]
name = "spend-manager-service"
version = "0.1.0"
description = "Service for personal spending management"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic~=2.12",
    "pandas==2.2.3",
    "sqlalchemy>=2.0.0",
    "sqlite3",
    "fastapi>=0.115.0",
    "uvicorn>=0.29.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=6.0.0"
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"